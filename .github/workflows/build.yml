# IW4Iris — continuous integration.
#
#   windows-msvc: the release build the way IW4x's own CI builds (Visual
#                 Studio 2022, premake5 vs2022, MSBuild), the launcher and the
#                 tests with CMake (MSVC), the test run, the release package
#                 and its checksums.
#   linux-tests:  the game-independent tests with GCC and -Werror, and the
#                 Blender add-on tests.
#   release:      for a version tag (vX.Y.Z) only: publishes the Windows
#                 package and SHA256SUMS.txt as a GitHub Release. The
#                 launcher's self-update installs exactly these files (see
#                 launcher/src/Updater.hpp), so a release is published only
#                 when both jobs pass and the tag matches CMakeLists.txt.
#
# A green run proves the build and the automated tests; it does not run the
# game (see docs/TESTING.md for the in-game checks).
name: Build

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-msvc:
    name: Windows (MSVC) build, tests, package
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build, test and package
        shell: pwsh
        run: .\tools\build.ps1 -Configuration Release -Package

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Filter *.zip | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Tee-Object -FilePath dist\SHA256SUMS.txt -Append
          }

      - name: Upload the release package
        uses: actions/upload-artifact@v4
        with:
          name: IW4Iris-Windows-x86-msvc
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  linux-tests:
    name: Linux (GCC) tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure and build
        run: |
          cmake -S . -B build/linux -DCMAKE_BUILD_TYPE=Debug -DIW4IRIS_WERROR=ON
          cmake --build build/linux --parallel

      - name: Test
        run: |
          ctest --test-dir build/linux --output-on-failure
          python3 -I tests/python/test_blender_addon.py
          python3 -I tests/python/test_gsc.py

      - name: Tests under AddressSanitizer and UndefinedBehaviorSanitizer
        # Memory errors (e.g. a pointer into a vector that grew) can pass a
        # normal run and fail at random elsewhere; the sanitizers make them
        # fail here, every time.
        run: |
          cmake -S . -B build/sanitize -DCMAKE_BUILD_TYPE=Debug -DIW4IRIS_WERROR=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=undefined"
          cmake --build build/sanitize --parallel
          ctest --test-dir build/sanitize --output-on-failure

  release:
    name: Publish the release (version tags only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-msvc, linux-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the package built for this tag
        uses: actions/download-artifact@v4
        with:
          name: IW4Iris-Windows-x86-msvc
          path: release

      - name: Check the version and the checksums
        run: |
          version="$(sed -n 's/^project(IW4Iris VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in CMakeLists.txt ($version)"
            exit 1
          fi
          test -f "release/IW4Iris-v$version-Windows-x86.zip"
          (cd release && tr -d '\r' < SHA256SUMS.txt | sha256sum -c -)

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v head="## ${GITHUB_REF_NAME#v} " 'index($0, head) == 1 {p = 1; next} /^## / && p {exit} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt \
            --title "IW4Iris $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
